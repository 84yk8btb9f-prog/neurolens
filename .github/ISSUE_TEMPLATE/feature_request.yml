name: Feature request
description: Suggest an idea or improvement for NeuroPulse
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you're trying to solve, not just the solution — it helps evaluate alternatives.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend (FastAPI / scoring)
        - Frontend (Next.js / UI)
        - Both / not sure
        - Docs
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that NeuroPulse doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought about.
    validations:
      required: false
